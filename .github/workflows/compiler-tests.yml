name: compiler-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      nethermind_branch:
        description: "nethermind branch (empty = default)"
        required: false
        type: string
      bflat_branch:
        description: "bflat-ts branch (empty = current)"
        required: false
        type: string
      full:
        description: "run full test suite (--full)"
        required: false
        type: boolean
        default: false
      test:
        description: "test path(s), space/comma-separated, e.g. bflat-ts/tls/basic bflat-ts/http/get (empty = all)"
        required: false
        type: string
      zisk_image:
        description: "Zisk Docker image override (empty = default)"
        required: false
        type: string
      bflat_image:
        description: "bflat Docker image override for riscv64, or a list arch=image,... (empty = default)"
        required: false
        type: string
      bflat_riscv32_image:
        description: "bflat Docker image override for riscv32 (empty = default)"
        required: false
        type: string
      require_pass:
        description: "fail when a test fails, not only when the run fails"
        required: false
        type: boolean
        default: false
      extlib:
        description: "runtime package overrides, a list platform=package,... with zisk, zisk_sim, sp1, openvm, airbender (empty = the packages of each package.xml)"
        required: false
        type: string
      codegenopt:
        description: "extra bflat --codegenopt values, a list name=value,... (empty = none)"
        required: false
        type: string
  workflow_call:
    inputs:
      nethermind_branch:
        required: false
        type: string
      bflat_branch:
        required: false
        type: string
      full:
        required: false
        type: boolean
        default: false
      test:
        required: false
        type: string
      zisk_image:
        required: false
        type: string
      bflat_image:
        required: false
        type: string
      bflat_riscv32_image:
        required: false
        type: string
      require_pass:
        required: false
        type: boolean
        default: false
      extlib:
        required: false
        type: string
      codegenopt:
        required: false
        type: string
    secrets:
      HORIZON_HOOK_TOKEN:
        required: true
      HORIZON_API_TOKEN:
        required: true

jobs:
  compiler-tests:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Run suite on zk-testing
        env:
          HOST: https://zk-testing.nethermind.dev
          HORIZON_HOOK_TOKEN: ${{ secrets.HORIZON_HOOK_TOKEN }}
          HORIZON_API_TOKEN: ${{ secrets.HORIZON_API_TOKEN }}
          # A caller in another repository runs main unless it names a branch:
          # its own branch names mean nothing here.
          BFLAT_BRANCH: ${{ inputs.bflat_branch || (github.repository == 'NethermindEth/bflat-ts' && (github.head_ref || github.ref_name)) || 'main' }}
          NETHERMIND_BRANCH: ${{ inputs.nethermind_branch || '' }}
          FULL: ${{ inputs.full == true && '1' || '' }}
          TEST: ${{ inputs.test || '' }}
          ZISK_IMAGE: ${{ inputs.zisk_image || '' }}
          BFLAT_IMAGE: ${{ inputs.bflat_image || '' }}
          BFLAT_RISCV32_IMAGE: ${{ inputs.bflat_riscv32_image || '' }}
          EXTLIB: ${{ inputs.extlib || '' }}
          CODEGENOPT: ${{ inputs.codegenopt || '' }}
        run: |
          set -euo pipefail

          # The suite fails every build on a malformed list (TS_BFLAT_EXTLIB,
          # TS_BFLAT_CODEGENOPT); refuse it here, before a run is queued.
          check_list() {
            local name=$1 list=$2 re=$3 max=$4 rest entry key seen=, n=0
            if [ "${#list}" -ge 4096 ]; then
              echo "::error::$name: the list is too long"
              exit 1
            fi
            rest=$list
            while :; do
              entry=${rest%%,*}
              n=$((n + 1))
              if ! [[ $entry =~ $re ]]; then
                echo "::error::$name: entry $n is malformed"
                exit 1
              fi
              key=${entry%%=*}
              if [ "$max" -eq 0 ]; then
                case "$seen" in
                  *",$key,"*)
                    echo "::error::$name: entry $n names $key twice"
                    exit 1
                    ;;
                esac
                seen="$seen$key,"
              elif [ "$n" -gt "$max" ]; then
                echo "::error::$name: more than $max entries"
                exit 1
              fi
              [ "$rest" = "$entry" ] && break
              rest=${rest#*,}
            done
          }
          if [ -n "$EXTLIB" ]; then
            check_list extlib "$EXTLIB" \
              '^(zisk|zisk_sim|sp1|openvm|airbender)=[A-Za-z0-9._~:/?#@+=%&-]+$' 0
          fi
          if [ -n "$CODEGENOPT" ]; then
            check_list codegenopt "$CODEGENOPT" \
              '^[A-Za-z][A-Za-z0-9_]*=[A-Za-z0-9._:/+-]+$' 8
          fi

          # The suite takes the images of all architectures as one list
          # (TS_BFLAT_IMAGE): arch=image entries, an entry without = for riscv64.
          if [ -n "$BFLAT_RISCV32_IMAGE" ]; then
            BFLAT_IMAGE="${BFLAT_IMAGE:+$BFLAT_IMAGE,}riscv32=$BFLAT_RISCV32_IMAGE"
          fi

          body=$(jq -n --arg ts "$BFLAT_BRANCH" --arg nm "$NETHERMIND_BRANCH" \
                    --arg full "$FULL" --arg test "$TEST" \
                    --arg zisk "$ZISK_IMAGE" --arg bflat "$BFLAT_IMAGE" \
                    --arg extlib "$EXTLIB" --arg codegenopt "$CODEGENOPT" \
            '{bflat_branch: $ts}
             + (if $nm != "" then {nethermind_branch: $nm} else {} end)
             + (if $full != "" then {full: $full} end)
             + (if $test != "" then {test: $test} end)
             + (if $zisk != "" then {zisk_image: $zisk} end)
             + (if $bflat != "" then {bflat_image: $bflat} end)
             + (if $extlib != "" then {extlib: $extlib} end)
             + (if $codegenopt != "" then {codegenopt: $codegenopt} end)')

          resp=$(curl -sS --fail-with-body -X POST "$HOST/hooks/bflat-ci" \
            -H "Authorization: Bearer $HORIZON_HOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body")
          echo "$resp"
          run_id=${resp#accepted }
          run_id=${run_id%%[[:space:]]*}

          # The service answers with plain text when it is unwell - a database
          # pool timeout, say - and jq exits non-zero on it, which under
          # `set -o pipefail` used to kill this step while the suite carried on
          # running on the host. A hiccup is not a verdict: keep polling, and
          # only give up once the run has been unreachable for long enough that
          # it is not coming back.
          unreachable=0
          while :; do
            body=$(curl -sS --max-time 30 "$HOST/horizon-api/runs/$run_id" \
              -H "Authorization: Bearer $HORIZON_API_TOKEN") || body=''
            status=$(printf '%s' "$body" | jq -er .status 2>/dev/null) || status=''

            case "$status" in
              queued|running)
                unreachable=0
                sleep 30
                ;;
              '')
                unreachable=$((unreachable + 1))
                if [ "$unreachable" -ge 20 ]; then
                  echo "::error::run $run_id unreachable for 10 minutes; last reply: ${body:-<empty>}"
                  exit 1
                fi
                echo "status unavailable (attempt $unreachable/20): ${body:-<empty>}"
                sleep 30
                ;;
              *)
                break
                ;;
            esac
          done

          echo "--- log tail ---"
          curl -sS "$HOST/horizon-api/runs/$run_id/logs?tail=65536" \
            -H "Authorization: Bearer $HORIZON_API_TOKEN"
          echo

          curl -sf -o junit.xml \
            "$HOST/horizon-api/runs/$run_id/artifacts/bflat-ts/junit.xml" \
            -H "Authorization: Bearer $HORIZON_API_TOKEN" \
            || echo "no junit.xml artifact"

          echo "status: $status"
          [ "$status" = success ]
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bflat-ts-junit
          path: junit.xml
          if-no-files-found: ignore
      - name: Publish test report
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5.6.2
        if: always()
        with:
          report_paths: junit.xml
          require_tests: ${{ inputs.require_pass == true }}
          fail_on_failure: ${{ inputs.require_pass == true }}
